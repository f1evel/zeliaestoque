<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zélia - Despesas Gerais</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <img src="img/logo-zelia.png" alt="Logo Zélia" />
      </div>
      <nav>
        <ul>
          <li><a href="dashboard.html">🏠 Dashboard</a></li>
          <li><a href="produtos.html">📦 Produtos</a></li>
          <li><a href="movimentacoes.html">🔁 Movimentações</a></li>
          <li><a href="estoque.html">📊 Estoque</a></li>
          <li><a href="financeiro.html">💰 Financeiro</a></li>
          <li><a href="contasReceber.html">📥 Contas a Receber</a></li>
          <li><a href="relatorios.html">📊 Relatórios</a></li>
          <li><a href="usuarios.html">👥 Usuários</a></li>
          <li><a class="ativo" href="despesas.html">📋 Despesas Gerais</a></li>
        </ul>
      </nav>
      <button onclick="logout()">Sair</button>
    </aside>

    <main class="main-content">
      <h1>📋 Despesas Gerais</h1>
      <div class="filtros" style="margin-bottom:10px; display:flex; gap:10px;">
        <div class="campo-filtro estreito">
          <label for="mes">Mês</label>
          <select id="mes"></select>
        </div>
        <div class="campo-filtro estreito">
          <label for="ano">Ano</label>
          <select id="ano"></select>
        </div>
        <!-- Botão de cópia removido: os dados do mês anterior são importados automaticamente -->
      </div>

        <div id="cards-despesas" class="cards"></div>
        <div style="margin:5px 0 15px 0;">
          <label for="dias-faturamento">Dias para cálculo:</label>
          <input type="number" id="dias-faturamento" value="25" style="width:60px;">
        </div>

        <div id="categorias-container"></div>
        <div style="margin-top:10px;">
          <button id="btn-adicionar-categoria">+ Adicionar categoria</button>
        </div>
        <div id="modal-categoria" class="modal">
          <h3 id="titulo-modal-categoria">Categoria</h3>
          <input type="text" id="campo-categoria" list="lista-categorias-gerais" style="width:100%;" />
          <datalist id="lista-categorias-gerais"></datalist>
          <div style="text-align:right; margin-top:10px;">
            <button id="btn-salvar-categoria">Salvar</button>
            <button onclick="fecharModalCategoria()">Cancelar</button>
          </div>
        </div>
        <div id="fundo-modal-categoria" class="fundo-modal" onclick="fecharModalCategoria()"></div>
      </main>
    </div>

    <div id="modal-despesa" class="modal">
      <h3 id="titulo-modal-despesa">Despesa</h3>
      <div class="form-grid form-grid-compacto">
        <div class="form-group" style="grid-column: span 2;">
          <label for="despesa-nome">Nome</label>
          <input type="text" id="despesa-nome" />
        </div>
        <div class="form-group">
          <label for="despesa-num-parcelas">Número de parcelas</label>
          <input type="number" id="despesa-num-parcelas" />
        </div>
        <div class="form-group">
          <label for="despesa-previsto">Valor previsto</label>
          <input type="number" step="0.01" id="despesa-previsto" />
        </div>
        <div class="form-group">
          <label for="despesa-real">Valor real</label>
          <input type="number" step="0.01" id="despesa-real" />
        </div>
      </div>
      <div class="form-group">
        <label>Vencimentos</label>
        <div id="despesa-vencimentos" style="display:flex;gap:5px;flex-wrap:wrap;">
          <input type="date" />
          <input type="date" />
          <input type="date" />
          <input type="date" />
          <input type="date" />
        </div>
      </div>
      <div class="form-group">
        <label>Pagamentos</label>
        <div id="despesa-pagamentos" style="display:flex;gap:5px;flex-wrap:wrap;">
          <input type="number" step="0.01" />
          <input type="number" step="0.01" />
          <input type="number" step="0.01" />
          <input type="number" step="0.01" />
          <input type="number" step="0.01" />
        </div>
      </div>
      <div class="form-group">
        <label for="despesa-observacoes">Observações</label>
        <textarea id="despesa-observacoes" rows="2"></textarea>
      </div>
      <div class="form-group" style="display:flex;gap:20px;">
        <label><input type="checkbox" id="despesa-arquivado" /> Arquivado</label>
      </div>
      <div style="text-align:right; margin-top:10px;">
        <button id="btn-salvar-despesa">Salvar</button>
        <button onclick="fecharModalDespesa()">Cancelar</button>
      </div>
    </div>
    <div id="fundo-modal-despesa" class="fundo-modal" onclick="fecharModalDespesa()"></div>

    <div id="modal-parcelas" class="modal">
      <div class="modal-content">
        <h3>Parcelas - Compra <span id="modal-compra-id"></span></h3>
        <div id="info-compra" style="margin-bottom:10px;"></div>
        <div id="parcelas-detalhes"></div>
        <div id="produtos-compra-detalhes" style="margin-top:20px;"></div>
        <div style="margin-top:10px; text-align:right;">
          <button onclick="fecharModalParcelas()">Fechar</button>
        </div>
      </div>
    </div>
    <div id="fundo-modal-parcelas" class="fundo-modal" onclick="fecharModalParcelas()"></div>

  <div id="spinner" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.2); align-items:center; justify-content:center; z-index:2000;">
    <div style="border:6px solid #ccc; border-top:6px solid #009688; border-radius:50%; width:40px; height:40px; animation:girar 1s linear infinite;"></div>
  </div>
  <style>
  @keyframes girar {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  </style>

  <script type="module" src="js/firebaseConfig.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/despesas.js"></script>
</body>
</html>
