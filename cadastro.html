<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Zélia - Cadastro</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/cadastro.js"></script>
</head>
<body class="auth-page">
  <div class="container">
    <img src="img/logo-zelia.png" alt="Zélia" class="logo" />
    <h2>Criar conta</h2>
    <input type="email" id="cad-email" placeholder="Email" />
    <input type="password" id="cad-senha" placeholder="Senha" />
    <input type="text" id="cad-empresa" placeholder="Código da empresa (opcional)" />
    <button id="btn-cadastrar">Cadastrar</button>
    <p id="cad-erro" class="error"></p>
    <a href="index.html">Voltar ao login</a>
  </div>
</body>
</html>
