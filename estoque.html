<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zélia - Estoque</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="img/logo-zelia.png" alt="Logo Zélia" />
      </div>
      <nav>
        <ul>
          <li><a href="dashboard.html">🏠 Dashboard</a></li>
          <li><a href="produtos.html">📦 Produtos</a></li>
          <li><a href="movimentacoes.html">🔁 Movimentações</a></li>
          <li><a class="ativo" href="estoque.html">📊 Estoque</a></li>
          <li><a href="financeiro.html">💰 Financeiro</a></li>
          <li><a href="relatorios.html">📊 Relatórios</a></li>
          <li><a href="usuarios.html">👥 Usuários</a></li>
        </ul>
      </nav>
      <button onclick="logout()">Sair</button>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      <h1>Relatórios de Estoque</h1>

      <!-- Filtros Avançados -->
      <fieldset class="filtros">
        <div class="campo-filtro">
          <label for="filtro-nome">Produto</label>
          <input type="text" id="filtro-nome" placeholder="Buscar..." list="lista-produtos" title="Nome do produto para filtrar">
          <datalist id="lista-produtos"></datalist>
        </div>

        <div class="campo-filtro">
          <label for="filtro-categoria">Categoria</label>
          <select id="filtro-categoria" title="Filtrar por categoria"></select>
        </div>

        <div class="campo-filtro">
          <label for="filtro-fornecedor">Fornecedor</label>
          <select id="filtro-fornecedor" title="Filtrar por fornecedor"></select>
        </div>

        <div class="campo-filtro">
          <label for="filtro-inicio">De</label>
          <input type="date" id="filtro-inicio" title="Data inicial do período">
        </div>

        <div class="campo-filtro">
          <label for="filtro-fim">Até</label>
          <input type="date" id="filtro-fim" title="Data final do período">
        </div>

        <div class="campo-filtro">
          <label for="filtro-tipo">Tipo</label>
          <select id="filtro-tipo" title="Tipo de movimentação">
            <option value="todos">Todas</option>
            <option value="entrada">Entradas</option>
            <option value="saida">Saídas</option>
          </select>
        </div>

        <div class="campo-filtro">
          <label for="filtro-validade">Validade até</label>
          <input type="date" id="filtro-validade" title="Itens com validade até a data escolhida">
        </div>

        <div class="campo-filtro">
          <label><input type="checkbox" id="filtro-critico" title="Somente itens abaixo do mínimo"> Estoque crítico</label>
        </div>

        <div class="campo-filtro">
          <label><input type="checkbox" id="filtro-previsao" title="Ordenar por previsão de esgotamento"> Exibir por previsão de esgotamento</label>
        </div>

        <div class="campo-filtro" id="container-periodo" style="display:none;">
          <label for="filtro-periodo" title="Período considerado para calcular a média de consumo">Período base</label>
          <select id="filtro-periodo">
            <option value="1">Último mês</option>
            <option value="3" selected>Últimos 3 meses</option>
            <option value="6">Últimos 6 meses</option>
            <option value="12">Último ano</option>
            <option value="0">Desde o início do sistema</option>
          </select>
        </div>

        <div class="campo-filtro" id="container-dias-esgotamento" style="display:none;">
          <label for="filtro-dias-esgotamento" title="Mostrar itens que esgotam em menos dias">Dias para esgotar</label>
          <input type="number" id="filtro-dias-esgotamento" min="1" value="30">
        </div>

        <div class="campo-filtro botoes">
          <button id="botao-limpar-estoque-geral" class="botao-acao" title="Limpar filtros aplicados">🧹</button>
          <button id="botao-exportar-csv-estoque-geral" class="botao-acao" title="Exportar relatório em CSV">📄</button>
          <button id="botao-exportar-pdf-estoque-geral" class="botao-acao" title="Exportar relatório em PDF">🖨️</button>
        </div>
      </fieldset>

      <!-- Cards Totais -->
      <div id="cards-estoque-geral" class="cards">
        <div class="card"><strong>Total de produtos:</strong> <span id="card-produtos">-</span></div>
        <div class="card"><strong>Total de unidades:</strong> <span id="card-unidades">-</span></div>
        <div class="card"><strong>Valor médio/unid.:</strong> <span id="card-valor-medio">-</span></div>
        <div class="card"><strong>Valor total em estoque:</strong> <span id="card-valor-total">-</span></div>
      </div>

      <!-- Tabela -->
      <div id="tabela-estoque-geral"></div>

      <!-- Gráficos -->
      <canvas id="grafico-categoria" style="max-height:300px; margin:20px 0;"></canvas>
      <canvas id="grafico-meses" style="max-height:300px; margin:20px 0;"></canvas>
    </main>
  </div>

  <!-- Spinner -->
  <div id="spinner" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#ffffffcc; z-index:2000; display:flex; align-items:center; justify-content:center;">
    <div style="border:6px solid #ccc; border-top:6px solid #009688; border-radius:50%; width:40px; height:40px; animation:girar 1s linear infinite;"></div>
  </div>

  <style>
  @keyframes girar {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  </style>

  <script type="module" src="js/firebaseConfig.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/estoque/estoqueUnificado.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const spinner = document.getElementById('spinner');
      if (spinner) spinner.style.display = 'none';
    });
  </script>
</body>
</html>
