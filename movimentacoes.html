<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zélia - Movimentações</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="img/logo-zelia.png" alt="Logo Zélia" />
      </div>
      <nav>
        <ul>
          <li><a href="dashboard.html">🏠 Dashboard</a></li>
          <li><a href="produtos.html">📦 Cadastro de Produtos</a></li>
          <li><a href="estoque.html">📊 Estoque</a></li>
          <li><a href="financeiro.html">💰 Financeiro</a></li>
          <li><a href="despesas.html">📋 Despesas Gerais</a></li>
          <li><a href="contasReceber.html">📥 Contas a Receber</a></li>
          <li><a href="relatorios.html">📊 Relatórios</a></li>
          <li><a href="usuarios.html">👥 Usuários</a></li>
        </ul>
      </nav>
      <button onclick="logout()">Sair</button>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      <h1>🔁 Movimentações</h1>

      <!-- Formulário de Movimentação -->
      <form id="form-movimentacao">
        <h2>Registrar Movimentação</h2>


        <div class="form-grid" style="grid-template-columns: repeat(6, 1fr);">
          <div class="form-group" style="grid-column: span 2; position: relative;">
            <label>Produto:</label>
            <input type="text" id="nome-produto" placeholder="Nome do Produto" required>
            <ul id="sugestoes-produto" class="autocomplete-list"></ul>
          </div>

          <div class="form-group" style="grid-column: span 1;">
            <label>Tipo:</label>
            <select id="tipo-movimentacao" required>
              <option value="entrada">Entrada</option>
              <option value="saida">Saída</option>
            </select>
          </div>

          <div class="form-group" style="grid-column: span 1;">
            <label>Quantidade:</label>
            <input type="number" id="quantidade" min="1" required>
          </div>
          <div class="form-group" style="grid-column: span 1;">
            <label>Preço Unitário:</label>
            <input type="number" id="preco-unitario" min="0" step="0.01">
          </div>

          <div class="form-group" style="grid-column: span 1;">
            <label>Data:</label>
            <input type="date" id="data-movimentacao" required>
          </div>

          <div class="form-group" style="grid-column: span 1;">
            <label>Validade:</label>
            <input type="date" id="validade" required>
          </div>

          <div id="grupo-fornecedor" class="form-group" style="grid-column: span 2;">
            <label>Fornecedor:</label>
            <input list="lista-fornecedores-mov" id="fornecedor-mov" placeholder="Fornecedor" />
            <datalist id="lista-fornecedores-mov"></datalist>
          </div>

          <!-- Select de Validades (exibido apenas em Saída com múltiplas validades) -->
          <div id="grupo-validade-saida" class="form-group" style="grid-column: span 2; display: none;">
            <label>Escolha a Validade para Saída:</label>
            <select id="select-validade-saida">
              <option value="">-- Selecione a validade --</option>
            </select>
          </div>

          <div class="form-group" style="grid-column: span 1;">
            <label>Lote:</label>
            <input type="text" id="lote">
          </div>

          <div class="form-group" style="grid-column: span 2;">
            <label>Observações:</label>
            <textarea id="observacoes" rows="1"></textarea>
          </div>

          <div class="form-group" style="grid-column: 1 / -1; text-align: right;">
            <button type="submit">Salvar Movimentação</button>
          </div>
        </div>
      </form>

      <!-- Lista de Movimentações -->
      <h2>Histórico de Movimentações</h2>
      <div class="filtros">
        <div class="campo-filtro">
          <label for="filtro-tipo-mov">Tipo:</label>
          <select id="filtro-tipo-mov">
            <option value="">Todos</option>
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
        </div>

        <div class="campo-filtro">
          <label for="filtro-produto-mov">Produto:</label>
          <input type="text" id="filtro-produto-mov" list="lista-produtos-filtro" placeholder="Produto...">
          <datalist id="lista-produtos-filtro"></datalist>
        </div>

        <div class="campo-filtro">
          <label for="filtro-data-inicio-mov">Data de:</label>
          <input type="date" id="filtro-data-inicio-mov">
        </div>

        <div class="campo-filtro">
          <label for="filtro-data-fim-mov">Data até:</label>
          <input type="date" id="filtro-data-fim-mov">
        </div>

        <div class="campo-filtro">
          <label for="filtro-fornecedor-mov">Fornecedor:</label>
          <input type="text" id="filtro-fornecedor-mov" list="lista-fornecedores-filtro">
          <datalist id="lista-fornecedores-filtro"></datalist>
        </div>

        <div class="campo-filtro">
          <label for="filtro-compra-mov">Compra ID:</label>
          <input type="text" id="filtro-compra-mov" list="lista-compra-id-filtro">
          <datalist id="lista-compra-id-filtro"></datalist>
        </div>

        <div class="campo-filtro" style="display:flex;align-items:end;">
          <button type="button" id="botao-limpar-filtros">Limpar filtros</button>
        </div>
      </div>
      <p id="contador-movimentacoes"></p>
      <div id="lista-movimentacoes"></div>
    </main>
  </div>

  <!-- 🔥 Modal de Confirmação -->
  <div id="modal-confirmacao" class="modal">
    <h3 id="titulo-confirmacao">Confirmação</h3>
    <p id="texto-confirmacao">Deseja realizar essa ação?</p>
    <div style="text-align:right; margin-top: 20px;">
      <button id="btn-cancelar-confirmacao">❌ Não</button>
      <button id="btn-confirmar-acao">✅ Sim</button>
    </div>
  </div>

  <div id="fundo-modal-confirmacao" class="fundo-modal" onclick="cancelarConfirmacao()"></div>

  <!-- 🔥 Spinner -->
  <div id="spinner">
    <div class="spinner"></div>
  </div>

  <!-- 🔧 Fundo do Modal de Entrada -->
  <div id="fundo-modal" class="fundo-modal"></div>

  <!-- ✅ Modal de Entrada de Produto -->
  <div id="modal-entrada" class="modal">
    <div class="modal-content">
      <h3 id="nome-produto-modal">Produto:</h3>

      <label>Identificador da Compra (compraId):</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="entrada-compra-id" list="lista-compra-id" placeholder="Ex: compra_2025-06-30_1" style="flex: 1;" />
        <button type="button" onclick="gerarNovoCompraId()">+ Nova Compra</button>
      </div>
      <datalist id="lista-compra-id"></datalist>

      <label>Forma de Pagamento:</label>
      <select id="entrada-forma-pagamento">
        <option value="pix">PIX</option>
        <option value="boleto">Boleto</option>
        <option value="cartao">Cartão</option>
        <option value="dinheiro">Dinheiro</option>
        <option value="transferencia">Transferência</option>
      </select>

      <label>Número do boleto / transação:</label>
      <input type="text" id="entrada-identificador-pagamento" placeholder="Opcional" />

      <label>Número de Parcelas:</label>
      <input type="number" id="entrada-numero-parcelas" min="1" value="1" />

      <label>Data do Primeiro Vencimento:</label>
      <input type="date" id="entrada-primeiro-vencimento" />

      <!-- Gerador de parcelas -->
      <div id="parcelas-container" style="margin-top:10px;"></div>

      <label>Observações:</label>
      <textarea id="entrada-observacoes" rows="2"></textarea>

      <div style="margin-top: 15px; text-align: right;">
        <button id="btn-entrada-cancelar" onclick="fecharModalEntrada()">Cancelar</button>
        <button id="btn-entrada-confirmar" onclick="confirmarEntradaEstoque()">Confirmar Entrada</button>
      </div>
    </div>
  </div>

  <!-- 🔥 Scripts -->
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/modalEntrada.js"></script>
  <script type="module" src="js/modais.js"></script>
  <script type="module" src="js/movimentacoes.js"></script>

</body>
</html>
